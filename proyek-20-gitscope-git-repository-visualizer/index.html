<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>GitScope — Git Repository Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>GitScope</h1>
        <p class="subtitle">Eksplorasi read-only repositori GitHub publik.</p>
      </div>
      <p id="app-status" class="app-status" role="status" aria-live="polite">Siap. Masukkan URL repositori GitHub publik.</p>
    </header>

    <main class="workspace">
      <section class="input-panel" aria-labelledby="input-title">
        <h2 id="input-title">Repository URL</h2>
        <form id="repository-form" class="repository-form" novalidate>
          <label class="field">
            <span>URL repositori GitHub</span>
            <input id="repository-url" type="url" autocomplete="off" spellcheck="false" placeholder="https://github.com/owner/repo" aria-describedby="validation-message" required>
          </label>
          <div class="actions">
            <button type="submit" id="check-button" class="button button-primary">Periksa repositori</button>
            <button type="button" id="cancel-button" class="button button-secondary" hidden>Batal</button>
            <button type="button" id="reset-button" class="button button-secondary">Reset</button>
          </div>
        </form>
        <p id="validation-message" class="message"></p>
      </section>

      <section class="result-panel" aria-labelledby="result-title">
        <h2 id="result-title">Hasil pemeriksaan</h2>
        <div id="repository-summary" class="repository-summary"></div>
        <div id="rate-limit" class="rate-limit"></div>

        <div id="branch-panel" class="branch-panel" hidden>
          <label class="field">
            <span>Branch</span>
            <select id="branch-select"></select>
          </label>
          <button type="button" id="load-more-branches" class="button button-secondary" hidden>Muat branch berikutnya</button>
          <p id="branch-status" class="message" role="status" aria-live="polite"></p>
        </div>

        <section class="commit-panel" aria-labelledby="commit-title">
          <div class="panel-header">
            <h3 id="commit-title">Commit timeline</h3>
            <button type="button" id="load-more-commits" class="button button-secondary" hidden>Muat commit berikutnya</button>
          </div>
          <p id="commit-status" class="message" role="status" aria-live="polite"></p>
          <ul id="commit-list" class="commit-list"></ul>
        </section>

        <section class="graph-panel" aria-labelledby="graph-title">
          <div class="panel-header">
            <h3 id="graph-title">Commit graph</h3>
            <span id="graph-summary" class="graph-summary"></span>
          </div>
          <div id="commit-graph" class="graph-container" role="region" aria-label="Grafik ancestry commit"></div>
          <p id="graph-status" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="comparison-panel" aria-labelledby="comparison-title">
          <div class="panel-header">
            <h3 id="comparison-title">Branch comparison</h3>
            <button type="button" id="compare-button" class="button button-primary">Compare</button>
          </div>
          <div class="comparison-controls">
            <label class="field">
              <span>Base</span>
              <select id="comparison-base"></select>
            </label>
            <label class="field">
              <span>Head</span>
              <select id="comparison-head"></select>
            </label>
          </div>
          <p id="comparison-status" class="message" role="status" aria-live="polite"></p>
          <div id="comparison-summary" class="comparison-summary"></div>
          <div class="comparison-columns">
            <section class="comparison-subpanel" aria-labelledby="comparison-commits-title">
              <h4 id="comparison-commits-title">Commits</h4>
              <ul id="comparison-commit-list" class="commit-list"></ul>
              <button type="button" id="load-more-comparison" class="button button-secondary" hidden>Muat commit berikutnya</button>
            </section>
            <section class="comparison-subpanel" aria-labelledby="comparison-files-title">
              <h4 id="comparison-files-title">Changed files</h4>
              <ul id="comparison-file-list" class="changed-files"></ul>
            </section>
          </div>
          <section class="comparison-subpanel" aria-labelledby="comparison-diff-title">
            <h4 id="comparison-diff-title">Diff</h4>
            <div id="comparison-diff" class="commit-detail"></div>
          </section>
        </section>

        <section class="detail-panel" aria-labelledby="detail-title">
          <h3 id="detail-title">Detail commit</h3>
          <div id="commit-detail" class="commit-detail"></div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
